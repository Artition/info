<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ГЕРОЙ v4 — пламя</title>
<style>
  @font-face{font-family:"UnboundedX";src:url("fonts/Unbounded-Black.ttf");font-weight:900}
  @font-face{font-family:"Montserrat";src:url("fonts/Montserrat-Regular.otf");font-weight:400}
  @font-face{font-family:"Chaos16";src:url("fonts/CHAOS16.otf")}
  :root{--paper:#E9E3D5;--ink:#171210;--purple:#6C3BFF;--orange:#FF6A1A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;background:var(--paper);color:var(--ink);font-family:"Montserrat";-webkit-font-smoothing:antialiased}

  .hero{position:relative;height:1000px;overflow:hidden}
  .paperbg{position:absolute;inset:0;background-image:url("assets/paper.png");background-size:cover;background-position:center;
    opacity:.22;mix-blend-mode:multiply}
  .halftone{position:absolute;inset:0;opacity:.22;
    background-image:radial-gradient(circle at center, rgba(23,18,16,.55) 1px, transparent 1.1px);background-size:6px 6px}

  #flame{position:absolute;right:70px;bottom:150px;width:214px;height:428px;image-rendering:pixelated;z-index:1;
    transform:rotate(-7deg)}
  #flame2{position:absolute;left:118px;top:420px;width:70px;height:140px;image-rendering:pixelated;z-index:1;
    transform:rotate(-11deg);opacity:.92}

  .top{position:absolute;left:60px;right:60px;top:55px;z-index:3}
  .mark{display:flex;align-items:center;gap:13px}
  .mark svg{width:32px;height:64px;display:block}
  .mark .wm{font-family:"UnboundedX";font-weight:900;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
  .meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;line-height:2.1;opacity:.75;margin-top:34px}
  .meta em{font-style:normal;color:var(--purple)}

  .poster{position:absolute;left:60px;right:60px;bottom:110px;z-index:3}
  .name{position:relative;font-family:"UnboundedX";font-weight:900;font-size:172px;line-height:.8;
    letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
  .tag{position:relative;z-index:4;font-family:"Chaos16";font-size:55px;line-height:.9;color:var(--purple);
    margin-bottom:-10px}

  .bar{position:absolute;left:60px;right:60px;bottom:55px;z-index:3;display:flex;align-items:center;gap:34px}
  .role{font-size:11px;letter-spacing:.2em;text-transform:uppercase;line-height:1.6;flex:0 0 auto;opacity:.8;white-space:nowrap}
  .role i{font-style:normal;color:var(--purple)}
  .socials{display:flex;gap:11px;flex:0 0 auto}
  .soc{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--paper);isolation:isolate}
  .soc::before{content:"";position:absolute;inset:0;background:var(--ink);filter:url(#torn);z-index:-1}
  .soc svg{width:26px;height:26px;display:block}
  .soc.vk{font-family:"Chaos16";font-size:21px;line-height:1}
  .scroll{font-size:10px;letter-spacing:.22em;text-transform:uppercase;flex:0 0 auto;display:flex;align-items:center;gap:9px;margin-left:auto;
    color:var(--paper);mix-blend-mode:difference;opacity:.85}
  .scroll .arw{width:26px;height:26px;border:2px solid currentColor;border-radius:50%;position:relative}
  .scroll .arw::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:10px;background:currentColor;transform:translateX(-50%)}
  .scroll .arw::before{content:"";position:absolute;left:50%;top:12px;width:5px;height:5px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateX(-50%) rotate(45deg)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="torn" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="hero">
  <div class="paperbg"></div><div class="halftone"></div>
  <canvas id="flame" width="160" height="320"></canvas>
  <canvas id="flame2" width="160" height="320"></canvas>

  <div class="top">
    <div class="mark">
      <svg viewBox="0 0 4 8" shape-rendering="crispEdges" fill="currentColor">
        <rect x="1" y="0" width="1" height="1"/><rect x="1" y="1" width="2" height="3"/>
        <rect x="0" y="4" width="3" height="1"/><rect x="0" y="5" width="4" height="1"/>
        <rect x="0" y="6" width="4" height="1"/><rect x="0" y="7" width="4" height="1"/>
      </svg>
      <div class="wm">Artition</div>
    </div>
    <div class="meta">01 <em>/</em> герой<br>M_0O_n <em>·</em> youtube</div>
  </div>

  <div class="poster">
    <div class="tag">дизайн, монтаж, миры</div>
    <div class="name">Artition</div>
  </div>

  <div class="bar">
    <div class="role">дизайнер <i>·</i> ютубер <i>·</i> художник</div>
    <div class="socials">
      <div class="soc" title="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 20H4v-2h16v2ZM4 18H2V6h2v12Zm18 0h-2V6h2v12ZM12 9h-2v6h2v2H8V7h4v2Zm3 6h-3v-2h3v2Zm2-2h-2v-2h2v2Zm-2-2h-3V9h3v2Zm5-5H4V4h16v2Z"/></svg></div>
      <div class="soc" title="Telegram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 23H5V21H19V23ZM5 21H3V19H5V21ZM21 21H19V19H21V21ZM3 19H1V5H3V19ZM17 19H15V17H11V15H15V7H12V5H17V19ZM23 19H21V5H23V19ZM13 11V13H11V15H9V17H7V13H9V11H13ZM7 13H4V11H7V13ZM9 11H7V9H9V11ZM12 9H9V7H12V9ZM5 5H3V3H5V5ZM21 5H19V3H21V5ZM19 3H5V1H19V3Z"/></svg></div>
      <div class="soc vk" title="VK">VK</div>
      <div class="soc" title="Discord"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 21H5v-2h4v2Zm10 0h-4v-2h4v2Zm-10-2H5v-2h4v2Zm10 0h-4v-2h4v2ZM5 17H3v-4h2v4Zm16 0h-2v-4h2v4Zm-2-4h-2v-2h2v2ZM7 13H5v-2h2v2Zm10-2h2v2h-2v-2ZM7 11H5V9h2v2Zm12 0h-2V9h2v2ZM9 9H7V7h2v2Zm6 0h-2V7h2v2Zm2-2h-2V5h2v2ZM9 7H7V5h2v2Z"/></svg></div>
    </div>
    <div class="scroll"><div class="arw"></div>листай</div>
  </div>
</div>

<script>
/* ── пиксельное пламя без зазоров, 4×8 ── */
const FLAME = [
  ".1..",
  ".11.",
  ".11.",
  ".11.",
  "111.",
  "1111",
  "1111",
  "1111"
];

/* ── value noise 2D ── */
function hash(x,y,s){ let n=x*374761393+y*668265263+s*1442695040888963407; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function fbm(x,y,s){ return vnoise(x,y,s)*0.62 + vnoise(x*2.1,y*2.1,s+11)*0.27 + vnoise(x*4.3,y*4.3,s+29)*0.11; }

const B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const RAMP=[[[12,7,24]],[[0.3,[64,28,150]]],[[0.55,[108,59,255]]],[[0.78,[255,106,26]]],[[1,[233,227,213]]]];
function ramp(t){
  const st=[[0,[12,7,24]],[.3,[64,28,150]],[.55,[108,59,255]],[.78,[255,106,26]],[1,[233,227,213]]];
  for(let i=1;i<st.length;i++){ if(t<=st[i][0]){ const a=st[i-1],b=st[i],k=(t-a[0])/(b[0]-a[0]); return [a[1][0]+(b[1][0]-a[1][0])*k,a[1][1]+(b[1][1]-a[1][1])*k,a[1][2]+(b[1][2]-a[1][2])*k]; } }
  return st[st.length-1][1];
}

const canvases=[document.getElementById('flame'),document.getElementById('flame2')];
const W=160, H=320, NC=4, NR=8;

/* маска логотипа в пикселях канваса */
const cellW=W/NC, cellH=H/NR;
const mask=new Float32Array(W*H);
for(let y=0;y<H;y++) for(let x=0;x<W;x++){
  const c=Math.min(NC-1,(x/cellW)|0), r=Math.min(NR-1,(y/cellH)|0);
  mask[y*W+x] = FLAME[r][c]==='1' ? 1 : 0;
}
/* размытие: даёт полосу на кромке, по ней и гуляет шум */
function blur(src,w,h,r){
  const tmp=new Float32Array(w*h), out=new Float32Array(w*h);
  for(let y=0;y<h;y++){ let acc=0;
    for(let x=-r;x<w+r;x++){ const xa=Math.min(w-1,Math.max(0,x+r)), xr=Math.min(w-1,Math.max(0,x-r-1));
      acc+=src[y*w+xa]-(x-r-1>=0?src[y*w+xr]:0); tmp[y*w+Math.min(w-1,Math.max(0,x))]=acc/(2*r+1); } }
  for(let x=0;x<w;x++){ let acc=0;
    for(let y=-r;y<h+r;y++){ const ya=Math.min(h-1,Math.max(0,y+r)), yr=Math.min(h-1,Math.max(0,y-r-1));
      acc+=tmp[ya*w+x]-(y-r-1>=0?tmp[yr*w+x]:0); out[Math.min(h-1,Math.max(0,y))*w+x]=acc/(2*r+1); } }
  return out;
}
const soft = blur(blur(mask,W,H,9),W,H,9);

let seed=1;
function draw(){
  const img=new ImageData(W,H);
  const d=img.data;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=(y*W+x);
    const n = fbm(x*0.06, y*0.06, seed);
    const inside = soft[i] > 0.30 + (n-0.5)*0.62;
    if(!inside){ d[i*4+3]=0; continue; }
    let v = 0.22 + (1-y/H)*0.55 + (n-0.5)*0.20;
    const th=(B4[y%4][x%4]+0.5)/16, lv=5;
    v=Math.round(Math.min(1,Math.max(0,v+(th-0.5)/lv))*(lv-1))/(lv-1);
    const col=ramp(v);
    d[i*4]=col[0]; d[i*4+1]=col[1]; d[i*4+2]=col[2]; d[i*4+3]=255;
  }
  for(const cvs of canvases){ cvs.getContext('2d').putImageData(img,0,0); }
}
draw();
setInterval(()=>{ seed=(seed%50)+1; draw(); }, 160);
</script>
</body>
</html>
