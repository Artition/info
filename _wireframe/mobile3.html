<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вайрфрейм v3 — мобильный</title>
<link rel="stylesheet" href="wire3.css"></head>
<body class="m">
<div class="board board--m">
  <div class="cap"><b>Моб · 390</b><span>v3</span></div>

  <section class="hero">
    <div class="meta">
      <div class="logo ph"><span class="ph__l">огонь</span></div>
      <div class="m"></div>
    </div>
    <div class="hero__mid">
      <span class="tag">01 · герой</span>
      <div class="hname">
        <div class="bar ink h1"></div>
        <div class="bar ink h2"></div>
        <div class="bar ink h3"></div>
      </div>
    </div>
    <div class="hero__bot">
      <div>
        <div class="role"></div>
        <div class="role2"></div>
      </div>
      <div class="scroll"><div class="dot"></div><div class="bar"></div></div>
    </div>
  </section>

  <section class="about">
    <div class="about__h">
      <span class="tag" style="display:block;margin-bottom:20px">02 · о себе</span>
      <div class="bar ink"></div>
      <div class="bar ink"></div>
    </div>
    <div class="prose"><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div><div class="bar short"></div></div>
    <div class="rows">
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
    </div>
    <div class="links-in">
      <span class="tag">ссылки</span>
      <div class="chips">
        <div class="chip"><span></span><b>yt</b></div>
        <div class="chip"><span></span><b>tg</b></div>
        <div class="chip"><span></span><b>tw</b></div>
        <div class="chip"><span></span><b>ds</b></div>
        <div class="chip"><span></span><b>том</b></div>
      </div>
    </div>
  </section>

  <section class="videos">
    <span class="tag">03 · видео</span>
    <div class="vhead"><div class="bar"></div></div>
    <div class="vgrid">
      <div class="vcard vcard--wide"><span class="ph__l">обложка 16:9</span></div>
      <div class="vcap"><div class="bar"></div><div class="bar s"></div></div>
      <div class="vcard"><span class="ph__l">обложка 16:9</span></div>
      <div class="vcap"><div class="bar"></div><div class="bar s"></div></div>
      <div class="vcard"><span class="ph__l">обложка 16:9</span></div>
      <div class="vcap"><div class="bar"></div><div class="bar s"></div></div>
    </div>
    <div class="vmore"><div class="dot"></div><div class="bar" style="width:140px"></div></div>
  </section>

  <section class="foot">
    <span class="tag">04 · подвал</span>
    <div class="foot__mail"></div>
    <div class="foot__b"><div class="bar" style="width:150px"></div><div class="bar" style="width:90px"></div></div>
  </section>
</div>
</body></html>
