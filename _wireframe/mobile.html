<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вайрфрейм — мобильный</title>
<link rel="stylesheet" href="wire.css"></head>
<body class="mobile">
<div class="board board--mobile">
  <div class="cap"><b>Мобильный · 390</b><span>тот же каркас</span></div>

  <div class="nav">
    <div class="logo ph" style="width:24px;height:30px"><span class="ph__lbl" style="left:3px;top:8px;font-size:9px">logo</span></div>
    <div class="nav__links"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>

  <section class="sec hero">
    <span class="tag">01 · герой</span>
    <div class="bar hero__eye" style="width:150px;height:9px;margin-bottom:20px"></div>
    <div class="name">
      <div class="bar ink"></div>
      <div class="bar ink" style="width:82%"></div>
    </div>
    <div class="bar hero__role" style="width:250px;height:12px;margin-top:22px"></div>
    <div class="bar hero__sub" style="width:190px;height:9px"></div>
    <div class="collage">
      <div class="ph p1"><span class="ph__lbl">работа</span></div>
      <div class="ph p2"><span class="ph__lbl">работа</span></div>
      <div class="ph p3"><span class="ph__lbl">работа</span></div>
    </div>
  </section>

  <section class="sec about">
    <span class="tag">02 · о себе</span>
    <div class="about__head"><div class="bar ink" style="height:38px"></div><div class="bar ink" style="height:38px;width:70%"></div></div>
    <div class="prose"><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div><div class="bar short"></div></div>
    <div class="rows">
      <div class="row"><div><div class="bar row__t" style="height:18px;width:120px"></div><div class="bar d row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="bar row__t" style="height:18px;width:120px"></div><div class="bar d row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="bar row__t" style="height:18px;width:120px"></div><div class="bar d row__h" style="width:150px"></div></div><div class="row__a"></div></div>
    </div>
  </section>

  <section class="sec videos">
    <span class="tag">03 · видео</span>
    <div class="vhead"><div class="vhead__t"></div></div>
    <div class="vgrid">
      <div class="vcard vcard--big ph" style="background:#c9c9c9;border-color:#b3b3b3"><span class="ph__lbl" style="color:#9a9a9a">обложка</span></div>
      <div class="vcap"><div class="bar"></div><div class="bar s"></div></div>
      <div class="vcard vcard--small ph" style="background:#c9c9c9;border-color:#b3b3b3"><span class="ph__lbl" style="color:#9a9a9a">обложка</span></div>
      <div class="vcap"><div class="bar"></div><div class="bar s"></div></div>
    </div>
    <div class="vmore"><div class="bar o"></div><div class="bar" style="width:140px"></div></div>
  </section>

  <section class="sec links">
    <span class="tag">04 · ссылки</span>
    <div class="links__t"></div>
    <div class="lrow"><div class="lrow__n"></div><div class="lrow__i"></div></div>
    <div class="lrow"><div class="lrow__n"></div><div class="lrow__i"></div></div>
    <div class="lrow"><div class="lrow__n"></div><div class="lrow__i"></div></div>
    <div class="lrow"><div class="lrow__n"></div><div class="lrow__i"></div></div>
    <div class="lrow"><div class="lrow__n"></div><div class="lrow__i"></div></div>
  </section>

  <section class="sec foot">
    <span class="tag">05 · подвал</span>
    <div class="bar d foot__eye" style="width:110px"></div>
    <div class="foot__mail"></div>
    <div class="foot__bottom"><div class="bar" style="width:150px"></div><div class="bar" style="width:90px"></div></div>
  </section>
</div>
</body></html>
