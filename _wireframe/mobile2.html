<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вайрфрейм v2 — мобильный</title>
<link rel="stylesheet" href="wire2.css"></head>
<body class="m">
<div class="board board--m">

  <div class="scene">

  </div>

  <section class="linksec">
    <span class="tag">02 · ссылки</span>
    <div class="chips">
      <div class="chip ph"><span></span><b class="ph__l">yt</b></div>
      <div class="chip ph"><span></span><b class="ph__l">tg</b></div>
      <div class="chip ph"><span></span><b class="ph__l">tw</b></div>
      <div class="chip ph"><span></span><b class="ph__l">ds</b></div>
      <div class="chip ph"><span></span><b class="ph__l">том</b></div>
    </div>
  </section>

  <section class="about">
    <span class="tag about__v">03 · о себе</span>
    <div class="about__h"><div class="bar ink"></div><div class="bar ink"></div></div>
    <div class="prose"><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div><div class="bar short"></div></div>
    <div class="rows">
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
      <div class="row"><div><div class="row__t" style="height:18px;width:120px"></div><div class="row__h" style="width:150px"></div></div><div class="row__a"></div></div>
    </div>
  </section>

  <section class="videos">
    <span class="tag">04 · видео</span>
    <div class="vhead"><div class="bar"></div></div>
    <div class="fan">
      <div class="fcard ph"><span class="ph__l">обложка</span></div>
      <div class="fcard ph"><span class="ph__l">обложка</span></div>
      <div class="fcard ph"><span class="ph__l">обложка</span></div>
    </div>
    <div class="vmore"><div class="dot"></div><div class="bar" style="width:140px"></div></div>
  </section>

  <section class="foot">
    <span class="tag">05 · подвал</span>
    <div class="bar d foot__eye" style="width:110px"></div>
    <div class="foot__mail"></div>
    <div class="foot__b"><div class="bar" style="width:150px"></div><div class="bar" style="width:90px"></div></div>
  </section>
</div>
</body></html>
